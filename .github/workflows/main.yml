name: Refresh Trading Stats

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC — edit to taste
  workflow_dispatch: {}     # lets you click "Run workflow" manually anytime

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest stats from Notion
        run: python scripts/fetch_stats.py
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}

      - name: Commit updated stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git diff --staged --quiet || git commit -m "Auto-refresh stats [skip ci]"
          git push
