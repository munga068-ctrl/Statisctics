<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First Hour — NASDAQ RTH Profile Tracker</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
// Applied before the stylesheet paints anything, so the page never flashes
// the wrong theme on load. Shares the same key as the Daily Summary
// dashboard (same origin), so the theme choice stays in sync between them.
(function(){
  try{
    var saved = localStorage.getItem('mmtrades-theme');
    var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ /* localStorage unavailable; defaults to light */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#F7F8FA;
    --surface:#FFFFFF;
    --surface-raised:#F0F2F5;
    --grid:#E3E6EA;
    --text:#14171C;
    --dim:#6B7280;
    --dimmer:#9AA1AC;
    --bull:#1C9A54;
    --bear:#D1352B;
    --hod:#B36B00;
    --lod:#0E8FAE;
    --synced-c:#9199A3;
    --stale-c:#B36B00;
    --radius:3px;
  }
  html[data-theme="dark"]{
    --void:#0B0E11;
    --surface:#12161B;
    --surface-raised:#171C22;
    --grid:#1E252C;
    --text:#E8ECEF;
    --dim:#6B7680;
    --dimmer:#454E56;
    --bull:#2ECC71;
    --bear:#E5484D;
    --hod:#F5A623;
    --lod:#3DDCF7;
    --synced-c:#6B7280;
    --stale-c:#E0A83B;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--void); color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  ::selection{ background:var(--hod); color:var(--void); }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .wrap{ max-width:1040px; margin:0 auto; padding:28px 24px 48px; }

  /* ---------- Header ---------- */
  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:1px solid var(--grid); padding-bottom:18px; margin-bottom:28px;
    flex-wrap:wrap; gap:14px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    color:var(--hod); text-transform:uppercase; margin:0 0 6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px;
    margin:0; letter-spacing:-0.01em;
  }
  .sub{ color:var(--dim); font-size:13px; margin-top:6px; }
  .meta{ text-align:right; font-size:11px; color:var(--dimmer); }
  .meta .n{ color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:22px; display:block; }
  .meta .lbl{ font-family:'IBM Plex Mono',monospace; letter-spacing:.08em; text-transform:uppercase; }
  .header-right{ display:flex; align-items:flex-end; gap:14px; }
  #themeBtn{
    border:1px solid var(--grid); background:var(--surface); border-radius:var(--radius);
    width:32px; height:32px; cursor:pointer; font-size:14px; color:var(--text);
    display:flex; align-items:center; justify-content:center; transition:background .2s ease, border-color .2s ease;
  }
  #themeBtn:hover{ background:var(--surface-raised); }
  #syncBtn{
    border:1px solid var(--grid); background:var(--surface); border-radius:var(--radius);
    height:32px; padding:0 12px; cursor:pointer; font-size:12px; color:var(--text);
    display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace;
    transition:background .2s ease, border-color .2s ease;
  }
  #syncBtn:hover{ background:var(--surface-raised); }
  #syncBtn:disabled{ opacity:.6; cursor:default; }
  #syncBtn .sync-icon{ font-size:13px; line-height:1; display:inline-block; }
  #syncBtn .sync-icon.spin{ animation:sync-spin .8s linear infinite; }
  @keyframes sync-spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  /* ---------- Sync status (top of page) ---------- */
  .status-line{ font-size:11px; margin:-18px 0 22px; font-family:'IBM Plex Mono',monospace; }
  .status-line.loading{ color:var(--dim); }
  .status-line.synced{ color:var(--synced-c); }
  .status-line.stale{ color:var(--stale-c); }
  .status-line.err{ color:var(--bear); }

  /* ---------- Signature: Opening Range Timeline ---------- */
  .timeline-card{
    background:var(--surface); border:1px solid var(--grid); border-radius:var(--radius);
    padding:22px 20px 16px; margin-bottom:26px;
  }
  .timeline-title{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; margin:0 0 2px;
  }
  .timeline-desc{ color:var(--dim); font-size:12px; margin:0 0 20px; }
  .timeline{ position:relative; padding-top:6px; }
  .timeline-axis{
    display:flex; position:relative; height:150px; align-items:flex-end;
    border-bottom:1px solid var(--grid);
  }
  .bucket{
    flex:1; position:relative; display:flex; flex-direction:column-reverse;
    align-items:center; height:100%; justify-content:flex-start; gap:2px;
    border-left:1px dashed var(--grid);
  }
  .bucket:first-child{ border-left:none; }
  .bucket.firsthour{ background:rgba(245,166,35,0.07); }
  .bar-pair{ display:flex; gap:3px; align-items:flex-end; height:100%; width:100%; justify-content:center; }
  .bar{ width:22px; border-radius:2px 2px 0 0; position:relative; transition:height .4s ease; }
  .bar.hod-bar{ background:linear-gradient(180deg,var(--hod),#B5760F); }
  .bar.lod-bar{ background:linear-gradient(180deg,var(--lod),#1D8CA6); }
  .bar-count{
    position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim);
    white-space:nowrap;
  }
  .timeline-labels{ display:flex; margin-top:10px; }
  .timeline-labels div{
    flex:1; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--dimmer);
  }
  .timeline-labels div.firsthour{ color:var(--hod); font-weight:600; }
  .legend{ display:flex; gap:18px; margin-top:16px; font-size:11px; color:var(--dim); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .swatch{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  /* ---------- Stat cards ---------- */
  .grid-cards{
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px;
  }
  @media(max-width:720px){ .grid-cards{ grid-template-columns:repeat(2,1fr); } }
  .card{
    background:var(--surface); border:1px solid var(--grid); border-radius:var(--radius);
    padding:16px 16px 14px;
  }
  .card .val{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; line-height:1; }
  .card .val.gold{ color:var(--hod); }
  .card .val.cyan{ color:var(--lod); }
  .card .label{ color:var(--dim); font-size:11.5px; margin-top:8px; line-height:1.4; }

  /* ---------- Direction cross table ---------- */
  .section-title{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;
    margin:0 0 4px;
  }
  .section-desc{ color:var(--dim); font-size:12px; margin:0 0 14px; }
  .cross{
    background:var(--surface); border:1px solid var(--grid); border-radius:var(--radius);
    margin-bottom:26px; overflow:hidden;
  }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em;
    color:var(--dimmer); text-transform:uppercase; padding:10px 16px; border-bottom:1px solid var(--grid);
    font-weight:500;
  }
  td{ padding:11px 16px; border-bottom:1px solid var(--grid); }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; font-family:'IBM Plex Mono',monospace; }
  .dir-name{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .dir-name.up{ color:var(--bull); }
  .dir-name.down{ color:var(--bear); }
  .pct-bar{ display:inline-block; height:6px; background:var(--grid); border-radius:3px; width:70px; margin-left:8px; position:relative; top:-1px; overflow:hidden; }
  .pct-bar i{ display:block; height:100%; border-radius:3px; }
  .pct-strong{ font-weight:700; }
  .hod-strong{ color:var(--hod); }
  .lod-strong{ color:var(--lod); }
  .notable-lbl{ font-family:'Inter',sans-serif; font-weight:500; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.02em; margin-top:2px; }
  .insight-card{
    background:var(--surface); border:1px solid var(--grid); border-radius:var(--radius);
    padding:20px 24px; margin-top:16px;
  }
  .insight-card h3{ margin:0 0 12px; font-family:'Space Grotesk',sans-serif; font-size:15px; }
  .insight-row{ display:flex; gap:14px; align-items:baseline; padding:10px 0; border-top:1px solid var(--grid); }
  .insight-row:first-of-type{ border-top:none; }
  .insight-row .tag{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px; padding:2px 8px; border-radius:3px; white-space:nowrap; }
  .insight-row .tag.up{ color:var(--bull); background:color-mix(in srgb, var(--bull) 12%, transparent); }
  .insight-row .tag.down{ color:var(--bear); background:color-mix(in srgb, var(--bear) 12%, transparent); }
  .insight-row p{ margin:0; font-size:13px; line-height:1.55; color:var(--dim); }
  .insight-row p b{ color:var(--text); }
  .insight-row .breakdown{ margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; }
  .insight-row .breakdown span{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:2px 7px;
    background:var(--surface-raised); border-radius:3px; color:var(--text);
  }
  .highlight-row td{ background:rgba(245,166,35,0.05); }

  footer{ margin-top:30px; color:var(--dimmer); font-size:11px; text-align:center; }
  footer a{ color:var(--dim); }

  .loading, .err{ padding:60px 20px; text-align:center; color:var(--dim); font-family:'IBM Plex Mono',monospace; font-size:12px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading stats…</div>
</div>

<script>
const WINDOW_ORDER = ["AM DR", "11AM-1PM", "1-2PM", "2:50-3:10", "3:30-4PM"];
const WINDOW_LABELS = {
  "AM DR": "9:30–10:30",
  "11AM-1PM": "11:00–13:00",
  "1-2PM": "13:00–14:00",
  "2:50-3:10": "14:50–15:10",
  "3:30-4PM": "15:30–16:00"
};

function normalizeWindow(raw){
  const s = raw.toUpperCase();
  if (s.includes("ADR") || s.includes("AM DR")) return "AM DR";
  if (s.includes("11AM-1PM") || s.includes("11AM- 1PM")) return "11AM-1PM";
  if (s.includes("1-2 PM") || s.includes("1-2PM")) return "1-2PM";
  if (s.includes("2:50-3:10")) return "2:50-3:10";
  if (s.includes("3:30-4")) return "3:30-4PM";
  return "OTHER";
}

function parseProfile(name){
  // e.g. "[AM DR High HOD]-[11AM-1PM LOD]"
  const segs = [...name.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
  let hodWindow = null, lodWindow = null;
  segs.forEach(seg => {
    const isHod = /HOD\s*$/.test(seg);
    const isLod = /LOD\s*$/.test(seg);
    const win = normalizeWindow(seg);
    if (isHod) hodWindow = win;
    if (isLod) lodWindow = win;
  });
  return { hodWindow, lodWindow };
}

function pct(n, d){ return d ? ((n/d)*100).toFixed(1) : "0.0"; }

// Recognizes a non-first-hour session window inside a profile bracket segment,
// e.g. "11AM-1PM HOD" -> {key:"11AM-1PM", label:"11:00 AM\u20131:00 PM"}.
const OTHER_WINDOWS = [
  { key: "11AM-1PM",  label: "11:00 AM\u20131:00 PM",  re: /11AM-\s*1PM/i },
  { key: "1-2PM",     label: "1:00\u20132:00 PM",      re: /1-2\s*PM/i },
  { key: "2:50-3:10", label: "2:50\u20133:10 PM",      re: /2:50-3:10/i },
  { key: "3:30-4PM",  label: "3:30\u20134:00 PM",      re: /3:30-4\s*PM/i },
  { key: "2:30-4PM",  label: "2:30\u20134:00 PM",      re: /2:30-4PM/i },
];
function findOtherWindow(seg){
  for (const w of OTHER_WINDOWS) if (w.re.test(seg)) return w;
  return null;
}

// Given a profile name like "[AM DR Low LOD]-[3:30-4PM HOD]", finds which
// window the requested extreme (LOD or HOD) formed in. Returns "AM DR" for
// the first hour, an OTHER_WINDOWS key otherwise, or "OTHER" if unrecognized.
function extractWindowFor(profileName, wantLod){
  const kw = wantLod ? "LOD" : "HOD";
  const segs = [...profileName.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
  for (const seg of segs){
    const s = seg.toUpperCase();
    if (s.includes(kw)){
      if (s.includes("AM DR") || s.includes("ADR")) return "AM DR";
      const w = findOtherWindow(seg);
      if (w) return w.key;
    }
  }
  // Fallback for inconsistently-tagged profiles (e.g. "[2:30-4PM]-[HOD LOD]")
  // where the window isn't attached directly to the HOD/LOD keyword.
  for (const seg of segs){
    const w = findOtherWindow(seg);
    if (w) return w.key;
  }
  return "OTHER";
}

function windowLabel(key){
  const found = OTHER_WINDOWS.find(w => w.key === key);
  return found ? found.label : "an unspecified window";
}

// Breaks down, for a given direction and extreme (HOD/LOD), how many days it
// formed in the first hour vs. which other window it formed in instead.
function altWindowBreakdown(directionProfileCounts, direction, wantLod){
  const counts = (directionProfileCounts && directionProfileCounts[direction]) || {};
  let total = 0, firstHour = 0;
  const other = {};
  Object.entries(counts).forEach(([name, n]) => {
    total += n;
    const w = extractWindowFor(name, wantLod);
    if (w === "AM DR") firstHour += n;
    else other[w] = (other[w] || 0) + n;
  });
  const otherSorted = Object.entries(other).sort((a, b) => b[1] - a[1]);
  return { total, firstHour, notFirstHour: total - firstHour, other: otherSorted };
}

async function render(){
  const app = document.getElementById('app');
  let stats;
  try {
    const res = await fetch('./data/stats.json', { cache: 'no-store' });
    stats = await res.json();
  } catch (e) {
    app.innerHTML = '<div class="err">Could not load data/stats.json — check the file exists and the GitHub Action has run.</div>';
    return;
  }

  const {
    total_days, first_hour_hod_count, first_hour_lod_count, both_first_hour_count,
    profile_counts, direction_totals, direction_first_hour_hod, direction_first_hour_lod,
    direction_profile_counts, generated_at
  } = stats;

  // Aggregate window counts from profile_counts for the timeline
  const hodByWindow = {}, lodByWindow = {};
  WINDOW_ORDER.forEach(w => { hodByWindow[w] = 0; lodByWindow[w] = 0; });
  Object.entries(profile_counts || {}).forEach(([name, count]) => {
    const { hodWindow, lodWindow } = parseProfile(name);
    if (hodWindow && hodByWindow[hodWindow] !== undefined) hodByWindow[hodWindow] += count;
    if (lodWindow && lodByWindow[lodWindow] !== undefined) lodByWindow[lodWindow] += count;
  });
  const maxBar = Math.max(1, ...WINDOW_ORDER.map(w => Math.max(hodByWindow[w], lodByWindow[w])));

  const up = direction_totals?.UPCLOSE || 0;
  const down = direction_totals?.DOWNCLOSE || 0;
  const both = direction_totals?.BOTHWAYS || 0;
  const side = direction_totals?.SIDEWAYS || 0;

  const upLod = direction_first_hour_lod?.UPCLOSE || 0;
  const downHod = direction_first_hour_hod?.DOWNCLOSE || 0;

  const upLodBreakdown = altWindowBreakdown(direction_profile_counts, "UPCLOSE", true);
  const downHodBreakdown = altWindowBreakdown(direction_profile_counts, "DOWNCLOSE", false);

  app.innerHTML = `
    <header>
      <div>
        <p class="eyebrow">MMTRADES · NASDAQ RTH TRACKER</p>
        <h1>First Hour</h1>
        <p class="sub">Where the day's high &amp; low actually form — vs. the 9:30–10:30 opening range</p>
      </div>
      <div class="header-right">
        <button id="syncBtn" title="Re-fetch latest data" type="button">
          <span class="sync-icon" id="syncIcon">⟳</span><span id="syncLabel">Sync</span>
        </button>
        <button id="themeBtn" title="Toggle light/dark theme">🌙</button>
        <div class="meta">
          <span class="n">${total_days}</span>
          <span class="lbl">days logged</span>
        </div>
      </div>
    </header>

    <div id="statusLine" class="status-line loading">Loading…</div>

    <div class="timeline-card">
      <p class="timeline-title">Opening Range Timeline</p>
      <p class="timeline-desc">HOD / LOD formation count by session window, across all logged days</p>
      <div class="timeline">
        <div class="timeline-axis">
          ${WINDOW_ORDER.map(w => `
            <div class="bucket ${w === 'AM DR' ? 'firsthour' : ''}">
              <div class="bar-pair">
                <div class="bar hod-bar" style="height:${(hodByWindow[w]/maxBar*100).toFixed(1)}%">
                  <span class="bar-count">${hodByWindow[w]}</span>
                </div>
                <div class="bar lod-bar" style="height:${(lodByWindow[w]/maxBar*100).toFixed(1)}%">
                  <span class="bar-count">${lodByWindow[w]}</span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="timeline-labels">
          ${WINDOW_ORDER.map(w => `<div class="${w === 'AM DR' ? 'firsthour' : ''}">${WINDOW_LABELS[w]}</div>`).join('')}
        </div>
      </div>
      <div class="legend">
        <span><i class="swatch" style="background:var(--hod)"></i> HOD formed</span>
        <span><i class="swatch" style="background:var(--lod)"></i> LOD formed</span>
        <span style="color:var(--hod)">▮ shaded = first hour (AM DR)</span>
      </div>
    </div>

    <div class="grid-cards">
      <div class="card">
        <div class="val gold">${first_hour_hod_count} <span style="font-size:14px;color:var(--dim)">/ ${total_days}</span></div>
        <div class="label">Days the HOD formed in the first hour (<b class="pct-strong">${pct(first_hour_hod_count, total_days)}%</b>)</div>
      </div>
      <div class="card">
        <div class="val cyan">${first_hour_lod_count} <span style="font-size:14px;color:var(--dim)">/ ${total_days}</span></div>
        <div class="label">Days the LOD formed in the first hour (<b class="pct-strong">${pct(first_hour_lod_count, total_days)}%</b>)</div>
      </div>
      <div class="card">
        <div class="val">${both_first_hour_count}</div>
        <div class="label">Days the entire range (HOD &amp; LOD) was set in the first hour</div>
      </div>
      <div class="card">
        <div class="val" style="color:var(--text)">${total_days - first_hour_hod_count - first_hour_lod_count + both_first_hour_count}</div>
        <div class="label">Days neither extreme formed in the first hour</div>
      </div>
    </div>

    <p class="section-title">By Day Direction</p>
    <p class="section-desc">Bullish days → look at the LOD column. Bearish days → look at the HOD column.</p>
    <div class="cross">
      <table>
        <thead>
          <tr>
            <th>Direction</th>
            <th class="num">Days</th>
            <th class="num">% of Days</th>
            <th class="num">HOD in 1st hr</th>
            <th class="num">LOD in 1st hr</th>
            <th class="num">Notable %</th>
          </tr>
        </thead>
        <tbody>
          <tr class="highlight-row">
            <td class="dir-name up">UPCLOSE</td>
            <td class="num">${up}</td>
            <td class="num pct-strong">${pct(up, total_days)}%</td>
            <td class="num">${direction_first_hour_hod?.UPCLOSE || 0} <span class="pct-bar"><i style="width:${pct(direction_first_hour_hod?.UPCLOSE||0, up)}%;background:var(--hod)"></i></span></td>
            <td class="num">${upLod} <span class="pct-bar"><i style="width:${pct(upLod, up)}%;background:var(--lod)"></i></span></td>
            <td class="num pct-strong lod-strong">${pct(upLod, up)}%<div class="notable-lbl">LOD in 1st hr</div></td>
          </tr>
          <tr class="highlight-row">
            <td class="dir-name down">DOWNCLOSE</td>
            <td class="num">${down}</td>
            <td class="num pct-strong">${pct(down, total_days)}%</td>
            <td class="num">${downHod} <span class="pct-bar"><i style="width:${pct(downHod, down)}%;background:var(--hod)"></i></span></td>
            <td class="num">${direction_first_hour_lod?.DOWNCLOSE || 0} <span class="pct-bar"><i style="width:${pct(direction_first_hour_lod?.DOWNCLOSE||0, down)}%;background:var(--lod)"></i></span></td>
            <td class="num pct-strong hod-strong">${pct(downHod, down)}%<div class="notable-lbl">HOD in 1st hr</div></td>
          </tr>
          <tr>
            <td class="dir-name">BOTHWAYS</td>
            <td class="num">${both}</td>
            <td class="num pct-strong">${pct(both, total_days)}%</td>
            <td class="num">${direction_first_hour_hod?.BOTHWAYS || 0}</td>
            <td class="num">${direction_first_hour_lod?.BOTHWAYS || 0}</td>
            <td class="num">—</td>
          </tr>
          <tr>
            <td class="dir-name">SIDEWAYS</td>
            <td class="num">${side}</td>
            <td class="num pct-strong">${pct(side, total_days)}%</td>
            <td class="num">${direction_first_hour_hod?.SIDEWAYS || 0}</td>
            <td class="num">${direction_first_hour_lod?.SIDEWAYS || 0}</td>
            <td class="num">—</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="insight-card">
      <h3>When the primary extreme misses the first hour</h3>
      <div class="insight-row">
        <span class="tag up">UPCLOSE</span>
        <p>
          LOD forms in the first hour on <b>${pct(upLodBreakdown.firstHour, upLodBreakdown.total)}%</b> of UPCLOSE days
          (${upLodBreakdown.firstHour}/${upLodBreakdown.total}). On the other
          <b>${upLodBreakdown.notFirstHour}</b> days (${pct(upLodBreakdown.notFirstHour, upLodBreakdown.total)}%), the LOD instead forms during:
          <span class="breakdown">
            ${upLodBreakdown.other.map(([key, n]) => `<span>${windowLabel(key)}: ${n} (${pct(n, upLodBreakdown.notFirstHour)}%)</span>`).join('')}
          </span>
        </p>
      </div>
      <div class="insight-row">
        <span class="tag down">DOWNCLOSE</span>
        <p>
          HOD forms in the first hour on <b>${pct(downHodBreakdown.firstHour, downHodBreakdown.total)}%</b> of DOWNCLOSE days
          (${downHodBreakdown.firstHour}/${downHodBreakdown.total}). On the other
          <b>${downHodBreakdown.notFirstHour}</b> days (${pct(downHodBreakdown.notFirstHour, downHodBreakdown.total)}%), the HOD instead forms during:
          <span class="breakdown">
            ${downHodBreakdown.other.map(([key, n]) => `<span>${windowLabel(key)}: ${n} (${pct(n, downHodBreakdown.notFirstHour)}%)</span>`).join('')}
          </span>
        </p>
      </div>
    </div>

    <footer>
      Auto-refreshed from Notion<br/>
      <a href="https://github.com" target="_blank" rel="noopener">Source data: INDICES LOG</a>
    </footer>
  `;

  setupStatusLine(generated_at);
  setupThemeToggle();
  setupSyncButton();
}

// ---------- Sync status (top of page), mirrors the Daily Summary dashboard ----------
// The stats.yml workflow runs on a 15-minute cron (backed up by an external
// cron-job.org trigger), so anything older than this is flagged as stale.
const STALE_THRESHOLD_MINUTES = 45;

function setupStatusLine(generatedAt){
  const statusLine = document.getElementById('statusLine');
  if (!statusLine) return;

  function update(){
    if (!generatedAt){
      statusLine.textContent = "No sync timestamp available.";
      statusLine.className = "status-line err";
      return;
    }
    const syncedAt = new Date(generatedAt);
    const minutesAgo = Math.max(0, Math.round((Date.now() - syncedAt.getTime()) / 60000));

    let ago;
    if (minutesAgo < 1) ago = "just now";
    else if (minutesAgo < 60) ago = minutesAgo + " min ago";
    else if (minutesAgo < 1440) ago = Math.round(minutesAgo / 60) + " hr ago";
    else ago = Math.round(minutesAgo / 1440) + " days ago";

    const isStale = minutesAgo > STALE_THRESHOLD_MINUTES;
    statusLine.textContent = isStale
      ? `Last synced ${ago} — this looks stale, the numbers above may be behind. Trigger the sync workflow manually to refresh.`
      : `Synced ${ago}`;
    statusLine.className = isStale ? "status-line stale" : "status-line synced";
  }

  update();
  setInterval(update, 30000);
}

// Theme toggle (light/dark). Initial theme is set by the tiny inline script
// in <head> so the correct theme is applied before first paint (no flash).
// Shares the 'mmtrades-theme' localStorage key with the Daily Summary
// dashboard, so switching on one page keeps the other in sync.
// ---------- Sync button ----------
// Re-fetches data/stats.json (bypassing cache) and re-renders — same pattern
// as the Sync button on the Playbook dashboard's Framework Ledger page.
function setupSyncButton(){
  const syncBtn = document.getElementById('syncBtn');
  const syncIcon = document.getElementById('syncIcon');
  const syncLabel = document.getElementById('syncLabel');
  if (!syncBtn) return;

  syncBtn.addEventListener('click', () => {
    syncBtn.disabled = true;
    syncIcon.classList.add('spin');
    syncLabel.textContent = 'Syncing…';
    render()
      .then(() => {
        const label = document.getElementById('syncLabel');
        if (label) label.textContent = 'Synced';
      })
      .catch(() => {
        const label = document.getElementById('syncLabel');
        if (label) label.textContent = 'Retry';
      })
      .finally(() => {
        setTimeout(() => {
          const label = document.getElementById('syncLabel');
          if (label) label.textContent = 'Sync';
        }, 2000);
      });
  });
}

function setupThemeToggle(){
  const themeBtn = document.getElementById('themeBtn');
  if (!themeBtn) return;

  function applyIcon(){
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeBtn.textContent = isDark ? '☀️' : '🌙';
  }
  applyIcon();

  themeBtn.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('mmtrades-theme', next); }catch(e){ /* storage may be blocked; theme still applies for this session */ }
    applyIcon();
  });
}

render();
</script>
