<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First Hour — NASDAQ RTH Profile Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B0E11;
    --surface:#12161B;
    --surface-raised:#171C22;
    --grid:#1E252C;
    --text:#E8ECEF;
    --dim:#6B7680;
    --dimmer:#454E56;
    --bull:#2ECC71;
    --bear:#E5484D;
    --hod:#F5A623;
    --lod:#3DDCF7;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--void); color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--hod); color:var(--void); }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .wrap{ max-width:1040px; margin:0 auto; padding:28px 24px 48px; }

  /* ---------- Header ---------- */
  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:1px solid var(--grid); padding-bottom:18px; margin-bottom:28px;
    flex-wrap:wrap; gap:14px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    color:var(--hod); text-transform:uppercase; margin:0 0 6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px;
    margin:0; letter-spacing:-0.01em;
  }
  .sub{ color:var(--dim); font-size:13px; margin-top:6px; }
  .meta{ text-align:right; font-size:11px; color:var(--dimmer); }
  .meta .n{ color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:22px; display:block; }
  .meta .lbl{ font-family:'IBM Plex Mono',monospace; letter-spacing:.08em; text-transform:uppercase; }

  /* ---------- Signature: Opening Range Timeline ---------- */
  .timeline-card{
    background:var(--surface); border:1px solid var(--grid); border-radius:var(--radius);
    padding:22px 20px 16px; margin-bottom:26px;
  }
  .timeline-title{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; margin:0 0 2px;
  }
  .timeline-desc{ color:var(--dim); font-size:12px; margin:0 0 20px; }
  .timeline{ position:relative; padding-top:6px; }
  .timeline-axis{
    display:flex; position:relative; height:150px; align-items:flex-end;
    border-bottom:1px solid var(--grid);
  }
  .bucket{
    flex:1; position:relative; display:flex; flex-direction:column-reverse;
    align-items:center; height:100%; justify-content:flex-start; gap:2px;
    border-left:1px dashed var(--grid);
  }
  .bucket:first-child{ border-left:none; }
  .bucket.firsthour{ background:rgba(245,166,35,0.07); }
  .bar-pair{ display:flex; gap:3px; align-items:flex-end; height:100%; width:100%; justify-content:center; }
  .bar{ width:22px; border-radius:2px 2px 0 0; position:relative; transition:height .4s ease; }
  .bar.hod-bar{ background:linear-gradient(180deg,var(--hod),#B5760F); }
  .bar.lod-bar{ background:linear-gradient(180deg,var(--lod),#1D8CA6); }
  .bar-count{
    position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim);
    white-space:nowrap;
  }
  .timeline-labels{ display:flex; margin-top:10px; }
  .timeline-labels div{
    flex:1; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--dimmer);
  }
  .timeline-labels div.firsthour{ color:var(--hod); font-weight:600; }
  .legend{ display:flex; gap:18px; margin-top:16px; font-size:11px; color:var(--dim); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .swatch{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  /* ---------- Stat cards ---------- */
  .grid-cards{
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px;
  }
  @media(max-width:720px){ .grid-cards{ grid-template-columns:repeat(2,1fr); } }
  .card{
    background:var(--surface); border:1px solid var(--grid); border-radius:var(--radius);
    padding:16px 16px 14px;
  }
  .card .val{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; line-height:1; }
  .card .val.gold{ color:var(--hod); }
  .card .val.cyan{ color:var(--lod); }
  .card .label{ color:var(--dim); font-size:11.5px; margin-top:8px; line-height:1.4; }

  /* ---------- Direction cross table ---------- */
  .section-title{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;
    margin:0 0 4px;
  }
  .section-desc{ color:var(--dim); font-size:12px; margin:0 0 14px; }
  .cross{
    background:var(--surface); border:1px solid var(--grid); border-radius:var(--radius);
    margin-bottom:26px; overflow:hidden;
  }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em;
    color:var(--dimmer); text-transform:uppercase; padding:10px 16px; border-bottom:1px solid var(--grid);
    font-weight:500;
  }
  td{ padding:11px 16px; border-bottom:1px solid var(--grid); }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; font-family:'IBM Plex Mono',monospace; }
  .dir-name{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .dir-name.up{ color:var(--bull); }
  .dir-name.down{ color:var(--bear); }
  .pct-bar{ display:inline-block; height:6px; background:var(--grid); border-radius:3px; width:70px; margin-left:8px; position:relative; top:-1px; overflow:hidden; }
  .pct-bar i{ display:block; height:100%; border-radius:3px; }
  .highlight-row td{ background:rgba(245,166,35,0.05); }

  /* ---------- Profile frequency ---------- */
  .profiles{
    background:var(--surface); border:1px solid var(--grid); border-radius:var(--radius);
    padding:6px 0;
  }
  .prow{
    display:flex; align-items:center; gap:14px; padding:9px 16px;
    border-bottom:1px solid var(--grid);
  }
  .prow:last-child{ border-bottom:none; }
  .prow .pname{ flex:1; font-size:12.5px; color:var(--text); }
  .prow .pname .tag{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px;
    color:var(--hod); border:1px solid rgba(245,166,35,.4); border-radius:2px;
    padding:1px 5px; margin-left:8px; vertical-align:middle;
  }
  .prow .track{ width:140px; height:6px; background:var(--grid); border-radius:3px; overflow:hidden; flex-shrink:0; }
  .prow .track i{ display:block; height:100%; background:var(--dimmer); }
  .prow.fh .track i{ background:linear-gradient(90deg,var(--hod),var(--lod)); }
  .prow .pcount{ font-family:'IBM Plex Mono',monospace; font-size:13px; width:30px; text-align:right; color:var(--dim); }

  footer{ margin-top:30px; color:var(--dimmer); font-size:11px; text-align:center; }
  footer a{ color:var(--dim); }

  .loading, .err{ padding:60px 20px; text-align:center; color:var(--dim); font-family:'IBM Plex Mono',monospace; font-size:12px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading stats…</div>
</div>

<script>
const WINDOW_ORDER = ["AM DR", "11AM-1PM", "1-2PM", "2:50-3:10", "3:30-4PM"];
const WINDOW_LABELS = {
  "AM DR": "9:30–10:30",
  "11AM-1PM": "11:00–13:00",
  "1-2PM": "13:00–14:00",
  "2:50-3:10": "14:50–15:10",
  "3:30-4PM": "15:30–16:00"
};

function normalizeWindow(raw){
  const s = raw.toUpperCase();
  if (s.includes("ADR") || s.includes("AM DR")) return "AM DR";
  if (s.includes("11AM-1PM") || s.includes("11AM- 1PM")) return "11AM-1PM";
  if (s.includes("1-2 PM") || s.includes("1-2PM")) return "1-2PM";
  if (s.includes("2:50-3:10")) return "2:50-3:10";
  if (s.includes("3:30-4")) return "3:30-4PM";
  return "OTHER";
}

function parseProfile(name){
  // e.g. "[AM DR High HOD]-[11AM-1PM LOD]"
  const segs = [...name.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
  let hodWindow = null, lodWindow = null;
  segs.forEach(seg => {
    const isHod = /HOD\s*$/.test(seg);
    const isLod = /LOD\s*$/.test(seg);
    const win = normalizeWindow(seg);
    if (isHod) hodWindow = win;
    if (isLod) lodWindow = win;
  });
  return { hodWindow, lodWindow };
}

function pct(n, d){ return d ? ((n/d)*100).toFixed(1) : "0.0"; }

async function render(){
  const app = document.getElementById('app');
  let stats;
  try {
    const res = await fetch('./data/stats.json', { cache: 'no-store' });
    stats = await res.json();
  } catch (e) {
    app.innerHTML = '<div class="err">Could not load data/stats.json — check the file exists and the GitHub Action has run.</div>';
    return;
  }

  const {
    total_days, first_hour_hod_count, first_hour_lod_count, both_first_hour_count,
    profile_counts, direction_totals, direction_first_hour_hod, direction_first_hour_lod,
    generated_at
  } = stats;

  // Aggregate window counts from profile_counts for the timeline
  const hodByWindow = {}, lodByWindow = {};
  WINDOW_ORDER.forEach(w => { hodByWindow[w] = 0; lodByWindow[w] = 0; });
  Object.entries(profile_counts || {}).forEach(([name, count]) => {
    const { hodWindow, lodWindow } = parseProfile(name);
    if (hodWindow && hodByWindow[hodWindow] !== undefined) hodByWindow[hodWindow] += count;
    if (lodWindow && lodByWindow[lodWindow] !== undefined) lodByWindow[lodWindow] += count;
  });
  const maxBar = Math.max(1, ...WINDOW_ORDER.map(w => Math.max(hodByWindow[w], lodByWindow[w])));

  const genDate = generated_at ? new Date(generated_at) : null;
  const genStr = genDate ? genDate.toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit', timeZoneName:'short' }) : '—';

  const up = direction_totals?.UPCLOSE || 0;
  const down = direction_totals?.DOWNCLOSE || 0;
  const both = direction_totals?.BOTHWAYS || 0;
  const side = direction_totals?.SIDEWAYS || 0;

  const upLod = direction_first_hour_lod?.UPCLOSE || 0;
  const downHod = direction_first_hour_hod?.DOWNCLOSE || 0;

  app.innerHTML = `
    <header>
      <div>
        <p class="eyebrow">MMTRADES · NASDAQ RTH TRACKER</p>
        <h1>First Hour</h1>
        <p class="sub">Where the day's high &amp; low actually form — vs. the 9:30–10:30 opening range</p>
      </div>
      <div class="meta">
        <span class="n">${total_days}</span>
        <span class="lbl">days logged</span>
      </div>
    </header>

    <div class="timeline-card">
      <p class="timeline-title">Opening Range Timeline</p>
      <p class="timeline-desc">HOD / LOD formation count by session window, across all logged days</p>
      <div class="timeline">
        <div class="timeline-axis">
          ${WINDOW_ORDER.map(w => `
            <div class="bucket ${w === 'AM DR' ? 'firsthour' : ''}">
              <div class="bar-pair">
                <div class="bar hod-bar" style="height:${(hodByWindow[w]/maxBar*100).toFixed(1)}%">
                  <span class="bar-count">${hodByWindow[w]}</span>
                </div>
                <div class="bar lod-bar" style="height:${(lodByWindow[w]/maxBar*100).toFixed(1)}%">
                  <span class="bar-count">${lodByWindow[w]}</span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="timeline-labels">
          ${WINDOW_ORDER.map(w => `<div class="${w === 'AM DR' ? 'firsthour' : ''}">${WINDOW_LABELS[w]}</div>`).join('')}
        </div>
      </div>
      <div class="legend">
        <span><i class="swatch" style="background:var(--hod)"></i> HOD formed</span>
        <span><i class="swatch" style="background:var(--lod)"></i> LOD formed</span>
        <span style="color:var(--hod)">▮ shaded = first hour (AM DR)</span>
      </div>
    </div>

    <div class="grid-cards">
      <div class="card">
        <div class="val gold">${first_hour_hod_count} <span style="font-size:14px;color:var(--dim)">/ ${total_days}</span></div>
        <div class="label">Days the HOD formed in the first hour (${pct(first_hour_hod_count, total_days)}%)</div>
      </div>
      <div class="card">
        <div class="val cyan">${first_hour_lod_count} <span style="font-size:14px;color:var(--dim)">/ ${total_days}</span></div>
        <div class="label">Days the LOD formed in the first hour (${pct(first_hour_lod_count, total_days)}%)</div>
      </div>
      <div class="card">
        <div class="val">${both_first_hour_count}</div>
        <div class="label">Days the entire range (HOD &amp; LOD) was set in the first hour</div>
      </div>
      <div class="card">
        <div class="val" style="color:var(--text)">${total_days - first_hour_hod_count - first_hour_lod_count + both_first_hour_count}</div>
        <div class="label">Days neither extreme formed in the first hour</div>
      </div>
    </div>

    <p class="section-title">By Day Direction</p>
    <p class="section-desc">Bullish days → look at the LOD column. Bearish days → look at the HOD column.</p>
    <div class="cross">
      <table>
        <thead>
          <tr>
            <th>Direction</th>
            <th class="num">Days</th>
            <th class="num">HOD in 1st hr</th>
            <th class="num">LOD in 1st hr</th>
          </tr>
        </thead>
        <tbody>
          <tr class="highlight-row">
            <td class="dir-name up">UPCLOSE</td>
            <td class="num">${up}</td>
            <td class="num">${direction_first_hour_hod?.UPCLOSE || 0} <span class="pct-bar"><i style="width:${pct(direction_first_hour_hod?.UPCLOSE||0, up)}%;background:var(--hod)"></i></span></td>
            <td class="num">${upLod} <span class="pct-bar"><i style="width:${pct(upLod, up)}%;background:var(--lod)"></i></span></td>
          </tr>
          <tr class="highlight-row">
            <td class="dir-name down">DOWNCLOSE</td>
            <td class="num">${down}</td>
            <td class="num">${downHod} <span class="pct-bar"><i style="width:${pct(downHod, down)}%;background:var(--hod)"></i></span></td>
            <td class="num">${direction_first_hour_lod?.DOWNCLOSE || 0} <span class="pct-bar"><i style="width:${pct(direction_first_hour_lod?.DOWNCLOSE||0, down)}%;background:var(--lod)"></i></span></td>
          </tr>
          <tr>
            <td class="dir-name">BOTHWAYS</td>
            <td class="num">${both}</td>
            <td class="num">${direction_first_hour_hod?.BOTHWAYS || 0}</td>
            <td class="num">${direction_first_hour_lod?.BOTHWAYS || 0}</td>
          </tr>
          <tr>
            <td class="dir-name">SIDEWAYS</td>
            <td class="num">${side}</td>
            <td class="num">${direction_first_hour_hod?.SIDEWAYS || 0}</td>
            <td class="num">${direction_first_hour_lod?.SIDEWAYS || 0}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="section-title">RTH Profile Frequency</p>
    <p class="section-desc">All logged HOD/LOD combinations, most common first. Gold tag = involves the first hour.</p>
    <div class="profiles">
      ${Object.entries(profile_counts || {}).sort((a,b) => b[1]-a[1]).map(([name, count]) => {
        const { hodWindow, lodWindow } = parseProfile(name);
        const fh = hodWindow === 'AM DR' || lodWindow === 'AM DR';
        const maxP = Math.max(...Object.values(profile_counts || {1:1}));
        return `
          <div class="prow ${fh ? 'fh' : ''}">
            <div class="pname">${name}${fh ? '<span class="tag">1ST HR</span>' : ''}</div>
            <div class="track"><i style="width:${(count/maxP*100).toFixed(0)}%"></i></div>
            <div class="pcount">${count}</div>
          </div>`;
      }).join('')}
    </div>

    <footer>
      Auto-refreshed from Notion · last updated ${genStr}<br/>
      <a href="https://github.com" target="_blank" rel="noopener">Source data: INDICES LOG</a>
    </footer>
  `;
}

render();
</script>
</body>
</html>
